<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halbjahres-Notenrechner</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7385;
    --border: #e2e5eb;
    --accent: #3d5afe;
    --accent-soft: #e8ecff;
    --sa: #3d5afe;
    --sa-soft: #e8ecff;
    --m: #0f9d77;
    --m-soft: #e2f6ef;
    --g1: #0f9d58; --g2: #5cb85c; --g3: #c9a227; --g4: #e08a1e; --g5: #d9534f; --g6: #a32020;
    --danger: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b1f29; --text: #e8eaf0; --muted: #9aa1b2; --border: #2c3240;
      --accent: #7c8cff; --accent-soft: #262c48; --sa: #8c9aff; --sa-soft: #262c48;
      --m: #3fcf9f; --m-soft: #17352c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1b1f29; --text: #e8eaf0; --muted: #9aa1b2; --border: #2c3240;
    --accent: #7c8cff; --accent-soft: #262c48; --sa: #8c9aff; --sa-soft: #262c48;
    --m: #3fcf9f; --m-soft: #17352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }

  .overall {
    margin: 20px 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .overall .big { font-size: 3rem; font-weight: 700; line-height: 1; min-width: 110px; }
  .overall .info { flex: 1; min-width: 200px; color: var(--muted); font-size: .92rem; }
  .overall .info strong { color: var(--text); font-size: 1.05rem; display: block; margin-bottom: 2px; }

  .add-subject { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-subject input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 1rem;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 8px 12px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .subject {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .subject-head { display: flex; align-items: center; gap: 12px; }
  .subject-head h2 { margin: 0; font-size: 1.15rem; flex: 1; word-break: break-word; }
  .avg-badge {
    font-weight: 700; font-size: 1.25rem; padding: 4px 12px; border-radius: 10px;
    background: var(--accent-soft); min-width: 64px; text-align: center;
  }
  .icon-btn { border: none; background: transparent; color: var(--muted); padding: 6px 8px; font-size: 1.05rem; }
  .icon-btn:hover { color: var(--danger); }

  .rows { margin-top: 12px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; }
  .row-label { font-size: .85rem; color: var(--muted); padding-top: 6px; }
  .row-label b { display: block; color: var(--text); font-size: .92rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    border: none; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: .95rem;
    position: relative;
  }
  .chip.sa { background: var(--sa-soft); color: var(--sa); }
  .chip.m { background: var(--m-soft); color: var(--m); }
  .chip:hover { text-decoration: line-through; opacity: .8; }
  .empty { color: var(--muted); font-size: .85rem; font-style: italic; }
  .adder { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .adder button { padding: 4px 0; width: 34px; font-size: .9rem; color: var(--muted); }
  .adder button:hover { color: var(--text); border-color: var(--accent); }
  .adder span { font-size: .78rem; color: var(--muted); align-self: center; margin-right: 4px; }
  .calc { margin-top: 10px; font-size: .82rem; color: var(--muted); }

  .footer-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 12px; }

  @media (max-width: 560px) {
    .row { grid-template-columns: 1fr; gap: 4px; }
    .overall .big { font-size: 2.4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Notenrechner Halbjahr</h1>
    <p>Schulaufgaben zählen doppelt, mündliche Noten einfach.</p>
  </header>

  <section class="overall" aria-live="polite">
    <div class="big" id="overallAvg">–</div>
    <div class="info">
      <strong id="overallLabel">Gesamtschnitt</strong>
      <span id="overallSub">Füge ein Fach hinzu und trage Noten ein.</span>
    </div>
  </section>

  <form class="add-subject" id="addForm">
    <input id="subjectName" type="text" placeholder="Neues Fach, z. B. Mathe" maxlength="40" autocomplete="off">
    <button class="primary" type="submit">+ Fach</button>
  </form>

  <div id="subjects"></div>

  <div class="footer-actions">
    <button type="button" id="demoBtn">Standardfächer einfügen</button>
    <button type="button" id="resetBtn">Alles löschen</button>
  </div>
  <p class="hint">Tipp: Auf eine eingetragene Note klicken, um sie zu entfernen. Deine Eingaben werden in diesem Browser gespeichert.</p>
</div>

<script>
(function () {
  const STORE_KEY = "notenrechner-halbjahr-v1";
  const WEIGHT = { sa: 2, m: 1 };
  const DEFAULT_SUBJECTS = ["Deutsch", "Mathematik", "Englisch", "Biologie", "Geschichte"];

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data)) return data;
      }
    } catch (e) {}
    return DEFAULT_SUBJECTS.map(n => ({ id: uid(), name: n, sa: [], m: [] }));
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function subjectAvg(s) {
    const sum = s.sa.reduce((a, g) => a + g * WEIGHT.sa, 0) + s.m.reduce((a, g) => a + g * WEIGHT.m, 0);
    const cnt = s.sa.length * WEIGHT.sa + s.m.length * WEIGHT.m;
    return cnt ? sum / cnt : null;
  }
  function fmt(n) { return n == null ? "–" : n.toFixed(2).replace(".", ","); }
  function gradeColor(n) {
    if (n == null) return "var(--muted)";
    const r = Math.min(6, Math.max(1, Math.round(n)));
    return "var(--g" + r + ")";
  }
  function word(n) {
    if (n == null) return "";
    const r = Math.min(6, Math.max(1, Math.round(n)));
    return ["", "sehr gut", "gut", "befriedigend", "ausreichend", "mangelhaft", "ungenügend"][r];
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render() {
    const box = document.getElementById("subjects");
    box.innerHTML = "";

    state.forEach(s => {
      const avg = subjectAvg(s);
      const el = document.createElement("div");
      el.className = "subject";

      const chips = (type) => {
        const list = s[type];
        if (!list.length) return '<span class="empty">noch keine</span>';
        return list.map((g, i) =>
          `<button class="chip ${type}" data-act="del" data-id="${s.id}" data-type="${type}" data-idx="${i}" title="Note entfernen">${g}</button>`
        ).join("");
      };
      const adder = (type) =>
        `<div class="adder"><span>hinzufügen:</span>${[1,2,3,4,5,6].map(g =>
          `<button type="button" data-act="add" data-id="${s.id}" data-type="${type}" data-grade="${g}" aria-label="Note ${g} hinzufügen">${g}</button>`
        ).join("")}</div>`;

      let calc = "";
      if (avg != null) {
        const saSum = s.sa.reduce((a, b) => a + b, 0);
        const mSum = s.m.reduce((a, b) => a + b, 0);
        calc = `(${saSum} × 2 + ${mSum}) ÷ (${s.sa.length} × 2 + ${s.m.length}) = ${fmt(avg)}`;
      }

      el.innerHTML = `
        <div class="subject-head">
          <h2>${esc(s.name)}</h2>
          <div class="avg-badge" style="color:${gradeColor(avg)}" title="${word(avg)}">${fmt(avg)}</div>
          <button class="icon-btn" data-act="remove" data-id="${s.id}" title="Fach löschen" aria-label="Fach ${esc(s.name)} löschen">✕</button>
        </div>
        <div class="rows">
          <div class="row">
            <div class="row-label"><b>Schulaufgaben</b>zählen ×2</div>
            <div><div class="chips">${chips("sa")}</div>${adder("sa")}</div>
          </div>
          <div class="row">
            <div class="row-label"><b>Mündlich</b>zählen ×1</div>
            <div><div class="chips">${chips("m")}</div>${adder("m")}</div>
          </div>
        </div>
        ${calc ? `<div class="calc">${calc}</div>` : ""}
      `;
      box.appendChild(el);
    });

    if (!state.length) {
      box.innerHTML = '<p class="empty">Noch keine Fächer. Lege oben eins an.</p>';
    }

    // Gesamtschnitt: Mittel der Fachschnitte (jedes Fach gleich gewichtet)
    const avgs = state.map(subjectAvg).filter(a => a != null);
    const big = document.getElementById("overallAvg");
    const sub = document.getElementById("overallSub");
    if (avgs.length) {
      const total = avgs.reduce((a, b) => a + b, 0) / avgs.length;
      big.textContent = fmt(total);
      big.style.color = gradeColor(total);
      sub.textContent = `${word(total)} · Durchschnitt aus ${avgs.length} ${avgs.length === 1 ? "Fach" : "Fächern"} mit Noten (jedes Fach zählt gleich).`;
    } else {
      big.textContent = "–";
      big.style.color = "var(--muted)";
      sub.textContent = "Trage Noten ein, um deinen Schnitt zu sehen.";
    }
    save();
  }

  document.getElementById("subjects").addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const s = state.find(x => x.id === b.dataset.id);
    if (!s) return;
    const act = b.dataset.act;
    if (act === "add") {
      s[b.dataset.type].push(Number(b.dataset.grade));
    } else if (act === "del") {
      s[b.dataset.type].splice(Number(b.dataset.idx), 1);
    } else if (act === "remove") {
      const has = s.sa.length + s.m.length;
      if (has && !confirm(`Fach „${s.name}" mit allen Noten löschen?`)) return;
      state = state.filter(x => x.id !== s.id);
    }
    render();
  });

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const inp = document.getElementById("subjectName");
    const name = inp.value.trim();
    if (!name) return;
    state.push({ id: uid(), name, sa: [], m: [] });
    inp.value = "";
    render();
  });

  document.getElementById("demoBtn").addEventListener("click", () => {
    const existing = new Set(state.map(s => s.name.toLowerCase()));
    DEFAULT_SUBJECTS.forEach(n => {
      if (!existing.has(n.toLowerCase())) state.push({ id: uid(), name: n, sa: [], m: [] });
    });
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Wirklich alle Fächer und Noten löschen?")) return;
    state = [];
    render();
  });

  render();
})();
</script>
</body>
</html>
